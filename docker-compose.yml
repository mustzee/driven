version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cognitive-deck-api
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    networks:
      - cognitive-deck-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cognitive-deck-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cognitive-deck-net

networks:
  cognitive-deck-net:
    driver: bridge
